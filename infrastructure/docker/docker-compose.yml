# DeltaForge full-stack local deployment.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#
# Dashboard: http://localhost:8080
# API docs:  http://localhost:8000/docs
services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    image: deltaforge/backend:latest
    container_name: deltaforge-backend
    ports:
      - "8000:8000"
    environment:
      - DELTAFORGE_MODE=sandbox
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
    image: deltaforge/frontend:latest
    container_name: deltaforge-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
